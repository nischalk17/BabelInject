# Full no-defense grid on the primary model: all 30 tasks, 3 attacks, 5 languages, 4 channels.
# 30 benign + 3 attacks x 5 languages x (10 email + 10 file + 10 doc + 10 tool_output) = 630 runs.
# The MVP table (English + Nepali, email + tool_output) is a subset of these rows. Responses are cached,
# so an interrupted run can be restarted and resumes from the cache. Keep the laptop on power with sleep off.
models:
  - {provider: ollama, model: "qwen2.5:7b"}
gen: {temperature: 0.0, seed: 0}
languages: [en, ne, ne_rom, hi, mix]
channels: [email, file, doc, tool_output]
include_benign: true
max_steps: 8
output_dir: results/full
