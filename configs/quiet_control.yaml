# Capability control for the plain attack on 7B: the text as the user's own request, 5 runs.
models:
  - {provider: ollama, model: "qwen2.5:7b"}
gen: {temperature: 0.0, seed: 0}
tasks_file: configs/control_tasks.yaml
attacks_file: configs/attacks_quiet.yaml
languages: [en, ne, ne_rom, hi, mix]
channels: [user]
include_benign: false
max_steps: 8
output_dir: results/quiet_control
