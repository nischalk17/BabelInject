# Language-capability control on the hosted model (same design as configs/control.yaml): the attack text
# is the USER's own request, in 5 languages. 3 attacks x 5 languages x 1 task = 15 runs (~45 requests).
# Run this first: it is cheap and tells us whether the hosted model follows each language at all.
models:
  - {provider: groq, model: "qwen/qwen3.8-27b"}
gen: {temperature: 0.0, seed: 0}
tasks_file: configs/control_tasks.yaml
languages: [en, ne, ne_rom, hi, mix]
channels: [user]
include_benign: false
max_steps: 8
output_dir: results/hosted_control
